:root{--bg:#f4f6fa;--card:#fff;--tx:#101828;--mut:#667085;--line:#e4e7ec;--acc:#003087;--buf:#fdb827;--bufbg:#fff8e6}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:22px;text-align:center}
.bar{display:flex;gap:8px;align-items:center}
.bar button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:15px}
.bar .mid{flex:1;text-align:center;font-size:13px;color:var(--mut)}
.opt{display:flex;gap:14px;margin-top:8px;font-size:14px;color:var(--mut)}
.opt label{display:flex;gap:6px;align-items:center}
main{padding:0 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:18px 4px 6px}
.g{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.g.buf{background:var(--bufbg);border-color:var(--buf)}
.g.done{opacity:.5}
.g input{width:26px;height:26px;flex:0 0 auto;accent-color:var(--acc)}
.t{flex:0 0 52px;font-weight:700;font-variant-numeric:tabular-nums}
.m{flex:1;min-width:0}
.m b{font-weight:600}
.s{font-size:12px;color:var(--mut)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--buf);color:#222;white-space:nowrap}
.msg{text-align:center;color:var(--mut);padding:30px 10px}
</style>

async function init(){
  if(EMBED){ EMBED.games.forEach(g=>ALL[g.id]=g); mode="local";
    if(EMBED.games.length){const last=EMBED.games[EMBED.games.length-1].t; $("upd").textContent=EMBED.games.length+" zápasů"}
  } else { mode="api"; ALL=store.get("all",{}); }
  await show();
}
async function ensureApi(){
  const errs=[]; const u=API+start;
  for(const [n,url] of [["NHL",u],["proxy",("https://corsproxy.io/?url="+encodeURIComponent(u))]]){
    try{const j=await fetchJ(url,9000);
      if(!Array.isArray(j.gameWeek)) throw new Error("špatná odpověď");
      j.gameWeek.forEach(d=>(d.games||[]).forEach(g=>ALL[g.id]=norm(g)));
      store.set("all",ALL); return null;
    }catch(e){errs.push(n+": "+(e.message||e))}
  }
  return errs.join("<br>");
}
async function show(){
  let err=null;
  if(mode==="api"){ $("list").innerHTML='<div class="msg">Načítám…</div>'; err=await ensureApi(); }
  const end=addDays(start,6);
  $("range").textContent=fShort.format(new Date(start+"T12:00:00Z"))+" – "+fShort.format(new Date(end+"T12:00:00Z"));
  const games=Object.values(ALL).filter(g=>{const k=fKey.format(new Date(g.t));return k>=start&&k<=end}).sort((a,b)=>a.t.localeCompare(b.t));
  render(games,err);
}


function render(games,err){
  let html="",last="",n=0;
  for(const g of games){
    const buf=g.a.ab==="BUF"||g.h.ab==="BUF";
    if(prefs.onlybuf&&!buf) continue;
    const sn=!!seen[g.id]; if(prefs.hide&&sn) continue;
    const dt=new Date(g.t), k=fKey.format(dt);
    if(k!==last){last=k;const t=fDay.format(dt);html+="<h2>"+t.charAt(0).toUpperCase()+t.slice(1)+"</h2>"}
    const fin=g.s==="FINAL"||g.s==="OFF", live=g.s==="LIVE"||g.s==="CRIT";
    const sc=fin&&g.a.sc!=null?g.a.sc+":"+g.h.sc:(live?"živě":"");
    const nm=t=>(t.p+" "+t.n).trim();
    html+='<label class="g '+(buf?"buf":"")+" "+(sn?"done":"")+'"><input type="checkbox" data-id="'+g.id+'" '+(sn?"checked":"")+'>'+
      '<span class="t">'+fTime.format(dt)+'</span><span class="m"><b>'+nm(g.a)+'</b> @ <b>'+nm(g.h)+'</b><div class="s">'+(sc?sc+" · ":"")+(buf?"celý zápas":"5min recap")+'</div></span>'+
      (buf?'<span class="tag">BUF</span>':"")+'</label>';
    n++;
  }
  if(!n){ html='<div class="msg">'+(err?"Rozpis se nepodařilo načíst.<br><small>"+err+"</small><br><br>":"Žádné zápasy k zobrazení.")+(err?'<button onclick="show()" style="padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px">Zkusit znovu</button>':"")+"</div>" }
  $("list").innerHTML=html;
}
$("list").addEventListener("change",e=>{
  const id=e.target.dataset.id; if(!id) return;
  if(e.target.checked) seen[id]=1; else delete seen[id];
  store.set("seen",seen);
  const row=e.target.closest(".g");
  if(prefs.hide&&e.target.checked) row.remove(); else row.classList.toggle("done",e.target.checked);
});
$("hide").onchange=e=>{prefs.hide=e.target.checked;store.set("prefs",prefs);show()};
$("onlybuf").onchange=e=>{prefs.onlybuf=e.target.checked;store.set("prefs",prefs);show()};
$("prev").onclick=()=>{start=addDays(start,-7);show()};
$("next").onclick=()=>{start=addDays(start,7);show()};
$("today").onclick=()=>{start=monday(fKey.format(new Date()));show()};
init();
</script>
